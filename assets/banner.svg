<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Achraf Badreddine. AI and Software Engineering. LLM systems and evaluation. Open to a 6-month internship from March 2027.">
  <title>Achraf Badreddine, AI and Software Engineering</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B1A"/>
      <stop offset="0.55" stop-color="#0F1535"/>
      <stop offset="1" stop-color="#0A1F33"/>
    </linearGradient>

    <!-- Shimmer that sweeps across the name -->
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#A5B4FC"/>
      <stop offset="0.45" stop-color="#E0E7FF">
        <animate attributeName="offset" values="-0.3;1.3" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>

    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>

    <clipPath id="card"><rect width="1200" height="300" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>

    <!-- Drifting neon glows -->
    <circle r="170" fill="#6366F1" opacity="0.55" filter="url(#blur)">
      <animate attributeName="cx" values="180;420;180" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;220;60" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle r="160" fill="#06B6D4" opacity="0.45" filter="url(#blur)">
      <animate attributeName="cx" values="1040;760;1040" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="250;80;250" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle r="120" fill="#A855F7" opacity="0.35" filter="url(#blur)">
      <animate attributeName="cx" values="640;560;720;640" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="300;200;260;300" dur="12s" repeatCount="indefinite"/>
    </circle>

    <rect width="1200" height="300" fill="url(#grid)"/>

    <!-- Name -->
    <text x="600" y="138" text-anchor="middle" filter="url(#glow)"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
          font-size="68" font-weight="800" letter-spacing="-1" fill="url(#name)">Achraf Badreddine</text>

    <!-- Subtitle -->
    <text x="600" y="184" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
          font-size="22" font-weight="500" fill="#CBD5E1" letter-spacing="0.5">AI &amp; Software Engineering  ·  LLM systems &amp; evaluation</text>

    <!-- Availability pill -->
    <g transform="translate(600 232)">
      <rect x="-200" y="-19" width="400" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.15"/>
      <circle cx="-176" cy="0" r="6" fill="#22C55E"/>
      <circle cx="-176" cy="0" r="6" fill="#22C55E">
        <animate attributeName="r" values="6;13;6" dur="2.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0;0.6" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="12" y="6" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
            font-size="16" font-weight="600" fill="#E2E8F0">Open to a 6-month internship · March 2027</text>
    </g>
  </g>
</svg>
